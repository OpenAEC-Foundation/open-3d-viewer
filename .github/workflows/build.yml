name: Build

# Tests, the web build check and the desktop app for Windows, Linux and macOS, on every push to
# main and every pull request. Releases come from release.yml (a tag vYYYY.W.N). The desktop app
# includes Revit through the private rvt-dll library.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read-only access to standalone libraries
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.FORMAT_CRATES_SSH_KEYS }}
          log-public-key: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev libgtk-3-dev
      - name: README images
        run: python3 scripts/build_readme_images.py --check
      - name: Tests
        run: cargo test --release --locked
      - name: Web build (wasm32)
        run: cargo check --locked --target wasm32-unknown-unknown --lib --bin open-3d-viewer

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            exe: open-3d-viewer.exe
            mcp: open-3d-viewer-mcp.exe
            archive: open-3d-viewer-windows-x64.zip
          - platform: ubuntu-22.04
            exe: open-3d-viewer
            mcp: open-3d-viewer-mcp
            archive: open-3d-viewer-linux-x64.tar.gz
          - platform: macos-latest
            exe: open-3d-viewer
            mcp: open-3d-viewer-mcp
            archive: open-3d-viewer-macos-arm64.tar.gz
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Read-only access to standalone libraries
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.FORMAT_CRATES_SSH_KEYS }}
          log-public-key: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/${{ matrix.exe }}, target/release/${{ matrix.mcp }}, README.md -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/release ${{ matrix.exe }} ${{ matrix.mcp }} -C "$GITHUB_WORKSPACE" README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
