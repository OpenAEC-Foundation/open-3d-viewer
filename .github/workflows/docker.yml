# Tests the Docker image (packaging/docker, #27) when it changes, with the .deb of the latest
# release, without publishing anything: the container starts, becomes healthy, runs the viewer as
# a regular user and its stream can be photographed. The release workflow builds, tests and
# publishes the image of a new version, with the viewer of that version (also its MCP endpoint).
# After the OpenAEC Blueprint's .github/workflows/docker.yml.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The .deb of the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir deb
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build the image
        env:
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          set -euo pipefail
          ctx=$(mktemp -d)
          cp packaging/docker/Dockerfile packaging/docker/index.html packaging/docker/openaec-start packaging/docker/openaec-gezond "$ctx/"
          mkdir -p "$ctx/setup.d" && cp packaging/docker/setup.d/*.sh "$ctx/setup.d/"
          cp deb/*_amd64.deb "$ctx/"
          docker build "$ctx" -t open-3d-viewer:test \
            --build-arg APP_DEB="$(basename deb/*_amd64.deb)" \
            --build-arg APP_COMMAND=/usr/bin/open-3d-viewer \
            --build-arg APP_NAME=open-3d-viewer \
            --build-arg APP_TITLE="Open 3D Viewer Studio" \
            --build-arg APP_VERSION="$NUMBER" \
            --build-arg APP_SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            --build-arg APP_LICENSE=LGPL-3.0-or-later \
            --build-arg APP_DESCRIPTION="3D model viewer for AEC files, streamed to the browser" \
            --build-arg EXTRA_PACKAGES="$(cat packaging/docker/extra-packages)"
          docker image ls open-3d-viewer:test
      - name: Test the container
        run: bash packaging/docker/test-container.sh open-3d-viewer:test /usr/bin/open-3d-viewer docker-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test
          path: docker-test/
