name: Format crates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read-only access to standalone libraries
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.FORMAT_CRATES_SSH_KEYS }}
          log-public-key: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Independent library tests and web compatibility
        env:
          SKP_TEST_MODELS: ${{ github.workspace }}/test-models
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/model-dependencies.json"
          for crate in skp-reader tekla-reader ply-reader; do
            manifest=$(python3 -c 'import json,sys; print(next(p["manifest_path"] for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == sys.argv[2]))' "$RUNNER_TEMP/model-dependencies.json" "$crate")
            # Standalone manifests must not share the viewer's compiled copies of
            # crates with the same package name/version and a different source ID.
            export CARGO_TARGET_DIR="$RUNNER_TEMP/format-crates/$crate"
            cargo test --manifest-path "$manifest"
            cargo check --manifest-path "$manifest" --target wasm32-unknown-unknown
            if [ "$crate" = skp-reader ]; then
              cargo test --manifest-path "$manifest" --features corpus-tests
            fi
          done
