name: Format crates

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Pinned source snapshots
        run: python3 scripts/check_format_snapshots.py
      - name: Standalone crate tests and web compatibility
        env:
          SKP_TEST_MODELS: ${{ github.workspace }}/test-models
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          for crate in openaec-model skp-reader tekla-reader ply-reader; do
            cargo test --manifest-path vendor/$crate/Cargo.toml
            cargo check --manifest-path vendor/$crate/Cargo.toml --target wasm32-unknown-unknown
          done
          cargo test --manifest-path vendor/skp-reader/Cargo.toml --features corpus-tests
      - name: Linux viewer dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev libgtk-3-dev
      - name: Viewer integration tests
        run: cargo test --release --locked
      - name: Viewer web compatibility
        run: cargo check --locked --target wasm32-unknown-unknown --lib --bin open-3d-viewer
