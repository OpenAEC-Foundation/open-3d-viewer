name: Deploy site

# The web app (Rust → wasm, WebGPU) at open-3d-viewer.open-aec.com, built with trunk.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/open-3d-viewer.open-aec.com
      setup_command: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      install_command: curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin"
      build_command: trunk build --release
      deploy_source: dist
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
