name: Signed native product release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new release after all signing gates pass'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: signed-native-products-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: native-product-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only access to native format libraries
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.FORMAT_CRATES_SSH_KEYS }}
          log-public-key: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev libgtk-3-dev
      - name: NSIS and static Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV
      - name: Packaging contracts
        run: python -m unittest discover -s scripts -p "test_*products.py" -v
      - name: Viewer tests
        run: cargo test --release --locked --lib
      - name: Validator and shared core tests
        run: cargo test --release --locked --workspace --features bim-validator
      - name: Build and stage both identities at the pinned revision
        run: python scripts/release-products.py prepare
      - name: Verify signatures, notarize and package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python scripts/release-products.py package
      - uses: actions/upload-artifact@v4
        with:
          name: product-release-platform-${{ runner.os }}
          path: dist/product-release/*
          if-no-files-found: error

  verify:
    needs: build
    environment: native-product-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.inventory.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: product-release-platform-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete product inventory, hashes and source revision
        id: inventory
        run: |
          set -euo pipefail
          version=$(python scripts/release-products.py verify)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign and verify all assets and checksums with the organization key
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: bash scripts/release-products-gpg.sh release-assets
      - name: Attest the exact verified release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-products-verified
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    environment: native-product-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-products-verified
          path: release-assets
      - name: Publish both products without modifying installer catalogues
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -c SHA256SUMS)
          python3 scripts/publish-products.py
