[package]
name = "open-3d-viewer"
# OpenAEC calendar versioning: year.ISO week.patch (as openaec-ui and Open Pointcloud Studio)
version = "2026.44.10"
description = "Open 3D Viewer Studio: 3D model viewer for AEC files, desktop and web (iced + wgpu)"
authors = ["Open 3D Viewer Studio Contributors"]
license = "LGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

repository = "https://github.com/OpenAEC-Foundation/open-3d-viewer"
default-run = "open-3d-viewer"

# Standalone package; `revit/` (the build with Revit support) is a package of its own.
[workspace]
exclude = ["revit"]

[lib]
name = "open_3d_viewer"
path = "src/lib.rs"

[[bin]]
name = "open-3d-viewer"
path = "src/main.rs"

[[bin]]
name = "open-3d-viewer-mcp"
path = "src/bin/open-3d-viewer-mcp.rs"

[dependencies]
# GUI: iced (MIT) with the wgpu renderer (MIT OR Apache-2.0); `advanced` gives the custom shader widget.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "advanced", "svg", "canvas"] }
# Shared OpenAEC window shell, tokens, widgets and icons (LGPL-3.0-only; fonts OFL, icons CC BY-SA,
# see vendor/openaec-ui/NOTICE.md): snapshot of the OpenAEC Style Repo, see vendor/UPSTREAM.md
openaec-ui = { path = "vendor/openaec-ui", features = ["gpu-renderer"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Element properties (flat JSON objects from the BIM loaders)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File dialogs: native dialogs on the desktop, the browser's file picker on the web (MIT)
rfd = "0.17"
# std::time::Instant / SystemTime that also work in the browser (MIT OR Apache-2.0)
web-time = "1"
# PNG for the window icon and window screenshots (MIT OR Apache-2.0)
png = "0.18"
# Mesh formats
gltf = { version = "1.4", default-features = false, features = ["import", "names", "utils"] }
tobj = { version = "4", default-features = false }
stl_io = "0.11"
# SketchUp (.skp): ZIP inflate for the 2021+ container (MIT OR Apache-2.0) and face triangulation (ISC)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
earcutr = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["thread-pool"] }
# Headless renderer for `--screenshot` (MIT)
iced_test = "0.14"
# the shell's accessibility test lays it out without a GPU
iced_tiny_skia = "0.14"

# The web build (`trunk build`): WebGPU in the browser through iced's wgpu renderer
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "Location", "Url", "UrlSearchParams", "Blob", "BlobPropertyBag", "Response", "DragEvent", "DataTransfer", "FileList", "File", "console"] }
console_error_panic_hook = "0.1"

[target.'cfg(windows)'.build-dependencies]
# The app icon and version info in the .exe (MIT)
winresource = "0.1"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

# Mesh import is slow in debug builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
