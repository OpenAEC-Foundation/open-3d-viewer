[package]
name = "open-3d-viewer"
# OpenAEC calendar versioning: year.ISO week.patch (as openaec-ui and Open Pointcloud Studio)
version = "2026.45.12"
description = "Open 3D Viewer Studio: 3D model viewer for AEC files, desktop and web (iced + wgpu)"
authors = ["Open 3D Viewer Studio Contributors"]
license = "LGPL-3.0-or-later"
edition = "2021"
# openusd (USD import) needs Rust 1.96
rust-version = "1.96"

repository = "https://github.com/OpenAEC-Foundation/open-3d-viewer"
default-run = "open-3d-viewer"

# The desktop app includes Revit, Vertex BD and BTL support; the web target uses byte-oriented readers.
# Headless crates live under crates/; `cargo test` in the root still tests only the app.
[workspace]
members = ["crates/bim-structural", "crates/bim-core", "crates/bim-library"]

[lib]
name = "open_3d_viewer"
path = "src/lib.rs"

[[bin]]
name = "open-3d-viewer"
path = "src/main.rs"

[[bin]]
name = "open-3d-viewer-mcp"
path = "src/bin/open-3d-viewer-mcp.rs"

# One product alone (docs/architecture/products.md); a slim build of one is an invocation of its own:
# `cargo build --release --no-default-features --features modeller --bin open-bim-modeller`
[[bin]]
name = "open-bim-modeller"
path = "src/bin/open-bim-modeller.rs"
required-features = ["modeller"]

[[bin]]
name = "open-bim-collaborator"
path = "src/bin/open-bim-collaborator.rs"
required-features = ["collaborator"]

# The products a build holds: all three by default, with the switch at the top right of the window.
# Code that serves one product moves behind its feature module by module.
[features]
default = ["viewer", "modeller", "collaborator"]
viewer = []
modeller = []
collaborator = []

[dependencies]
# GUI: iced (MIT) with the wgpu renderer (MIT OR Apache-2.0); `advanced` gives the custom shader widget.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "advanced", "svg", "canvas"] }
# Shared OpenAEC window shell, tokens, widgets and icons (LGPL-3.0-only; fonts OFL, icons CC BY-SA,
# see vendor/openaec-ui/NOTICE.md): snapshot of the OpenAEC Style Repo, see vendor/UPSTREAM.md
openaec-ui = { path = "vendor/openaec-ui", features = ["gpu-renderer"] }
glam = { version = "0.30", features = ["bytemuck"] }
# The structural analysis model (nodes, members, supports, sections, loads, results) and its
# sam-json exchange format; headless, in this workspace
bim-structural = { path = "crates/bim-structural" }
# The BIM kernel: f64 geometry in tile frames and the five base elements; headless, in this workspace
bim-core = { path = "crates/bim-core" }
# The modeller's libraries: materials, layered build-ups, profiles and linear types; headless, in this workspace
bim-library = { path = "crates/bim-library" }
bytemuck = { version = "1", features = ["derive"] }
# Element properties (flat JSON objects from the BIM loaders)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File dialogs: native dialogs on the desktop, the browser's file picker on the web (MIT)
rfd = "0.17"
# std::time::Instant / SystemTime that also work in the browser (MIT OR Apache-2.0)
web-time = "1"
# PNG for the window icon and window screenshots (MIT OR Apache-2.0)
png = "0.18"
# Drawings exported as PNG: their SVG rendered with the app's fonts (Apache-2.0 OR MIT; already built for iced's svg)
resvg = { version = "0.45", default-features = false, features = ["text"] }
# PDF drawings laid on a level as underlays: their pages' paths (MIT; without its clock and threads)
lopdf = { version = "0.47", default-features = false }
# The gzip-compressed B2 icon masters in assets/b2, and the zlib-compressed arrays of FBX and Rhino
# .3dm meshes (MIT OR Apache-2.0). Rhino .3dm needs no other dependency: src/loaders/rhino.rs is
# written from McNeel's openNURBS source (published for reading 3dm files); no openNURBS code is built.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Mesh formats
gltf = { version = "1.4", default-features = false, features = ["import", "names", "utils"] }
tobj = { version = "4", default-features = false }
stl_io = "0.11"
# Polygon triangulation, LandXML surfaces and native CAD mesh import.
earcutr = "0.5"
roxmltree = "0.20"
# The shared OpenCAD drawing model (MPL-2.0): DWG and DXF through its acadrust codec (also the DWG/DXF
# reader of src/loaders/cad.rs), IFCCAD (the open 2D drawing profile on IFCX) through ifccad (MPL-2.0).
opencaddocument = { git = "https://github.com/HakanSeven12/opencaddocument", rev = "b9e1762969f3897e67e1801a2199445b6cf83b5d", features = ["ifcx"] }
# Independent OpenAEC libraries, pinned to immutable upstream commits.
skp-reader = { git = "https://github.com/OpenAEC-Foundation/skp-reader", rev = "31f8ef5bb9a8822771fbf008aa88e0f36444e01a" }
tekla-reader = { git = "https://github.com/OpenAEC-Foundation/tekla-reader", rev = "a17caa4f66a171bb4765f6f546b4eec24c0acace" }
ply-reader = { git = "https://github.com/OpenAEC-Foundation/ply-reader", rev = "028c51906cd7d8a0e72d6103afe80ad668d2543d" }
# QuickLZ 1.5 decompression for Archicad projects (MIT OR Apache-2.0)
quicklz = "0.3.1"
# ZIP containers: 3MF packages and zipped IFC (.ifczip) (MIT); deflate through the flate2 above
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# USD stages (.usda, .usdc, .usdz) with composition, pure Rust (MIT)
openusd = { version = "0.8", default-features = false }
# Point clouds: LAS and LAZ (las MIT, laz Apache-2.0) and E57 (MIT), all pure Rust
las = { version = "0.11", features = ["laz"] }
e57 = "0.11"
# Shapefiles with their .dbf attributes (shapefile and dbase, MIT, pure Rust); code pages through encoding_rs
shapefile = { version = "0.9", features = ["encoding_rs"] }
# STEP (AP203, AP214, AP242): Part 21 reader to a B-rep model and its face tessellator, pure Rust
# (Apache-2.0); cadmpeg-ir is large and takes long to compile
cadmpeg-codec-step = "0.6.8"
cadmpeg-ir = "0.6.8"
cadmpeg-tessellate = "0.6.8"
# IFC parsing, units, placements, openings and tessellation from the IFClite library (MPL-2.0):
# on the desktop on a large-stack worker pool, in the browser on the page's own thread.
ifc-lite-processing = "=25.0.1"
# its entity scanner and decoder (MPL-2.0, already built for the above): the building storeys
ifc-lite-core = "=25.0.1"
# its placement chains (MPL-2.0, already built for the above): where the grids are
ifc-lite-geometry = "=25.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Loads the Vertex BD / BTL reader (vertex.dll, shipped in vendor/vertex) at run time (ISC)
libloading = "0.8"
# Private standalone Revit library; compiled into the normal desktop application.
rvt-read = { git = "https://github.com/OpenAEC-Foundation/rvt-dll", rev = "5717fe06fa51e08e7a7a1434c04d2048fbd2cbb5" }
rvt-export = { git = "https://github.com/OpenAEC-Foundation/rvt-dll", rev = "5717fe06fa51e08e7a7a1434c04d2048fbd2cbb5", default-features = false }
rvt-model = { git = "https://github.com/OpenAEC-Foundation/rvt-dll", rev = "5717fe06fa51e08e7a7a1434c04d2048fbd2cbb5" }
iced = { version = "0.14", default-features = false, features = ["thread-pool"] }
# `gpu.log`: what iced and wgpu report about the graphics card (MIT OR Apache-2.0)
log = "0.4"
# Headless renderer for `--screenshot` (MIT)
iced_test = "0.14"
# the shell's accessibility test lays it out without a GPU
iced_tiny_skia = "0.14"

# The web build (`trunk build`): WebGPU in the browser through iced's wgpu renderer, and WebGL2
# where the browser has no WebGPU adapter (Chrome on Linux, many phones)
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "Location", "Url", "UrlSearchParams", "Blob", "BlobPropertyBag", "Response", "DragEvent", "DataTransfer", "FileList", "File", "console"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Validates the WGSL shaders and translates them to WebGL2's GLSL in tests, without a GPU; the
# version wgpu uses (MIT OR Apache-2.0)
naga = { version = "27.0.3", features = ["wgsl-in", "glsl-out"] }

[target.'cfg(unix)'.dependencies]
# Stops cleanly on SIGTERM, after a save under way (MIT OR Apache-2.0)
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
# Which GPU the window gets, before wgpu starts (`gpu`); the version wgpu-hal uses (MIT OR Apache-2.0)
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(windows)'.build-dependencies]
# The app icon and version info in the .exe (MIT)
winresource = "0.1"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

# Quick rebuilds while working on the app (scripts/dev.ps1): debug info without types and
# variables; with full debug info a change took a minute to compile and link, with this 10 s.
[profile.dev]
debug = "limited"

# Mesh import is slow in debug builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
