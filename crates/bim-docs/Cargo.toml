[package]
name = "bim-docs"
version = "0.1.0"
description = "Headless Docs of Open BIM Suite: the documents of a project in a folder a sync tool or network drive keeps the same for everyone, and what is said about each as IFCX"
authors = ["Open BIM Suite Contributors"]
license = "LGPL-3.0-or-later"
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/OpenAEC-Foundation/open-3d-viewer"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the IFCX parser and document model the suite reads IFCX with (ifcx-rs, MIT OR LGPL-3.0-or-later)
ifcx-core = { git = "https://github.com/OpenAEC-Foundation/ifcx-rs", rev = "a333af2278ff3fb3de1d9deb2fd17291b64d3c2b" }
