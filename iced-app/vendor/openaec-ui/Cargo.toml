[package]
name = "openaec-ui"
version = "2026.44.1"
edition = "2021"
description = "Shared native OpenAEC desktop shell, design tokens and components"
license = "LGPL-3.0-only AND CC-BY-SA-4.0 AND OFL-1.1 AND Apache-2.0"
readme = "README.md"
include = ["src/**", "assets/fonts/**", "assets/icons/**", "assets/find-bar/**", "assets/domain-icons/**", "assets/domain-icons-small/**", "assets/ribbon-icons/**", "licenses/**", "Cargo.toml", "README.md", "LICENSE.md", "NOTICE.md"]

[features]
gpu-renderer = ["iced/wgpu"]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "svg", "image", "web-colors", "advanced", "fira-sans", "thread-pool"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-script = "0.5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
iced_tiny_skia = "0.14"
