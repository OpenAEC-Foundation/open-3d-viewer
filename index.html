<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open 3D Viewer Studio</title>
    <meta name="description" content="Open 3D Viewer Studio: view SketchUp, Tekla, glTF, OBJ, STL and PLY models in the browser and save them as IFC. Open source, by the OpenAEC Foundation." />
    <link data-trunk rel="icon" href="assets/logo.svg" />
    <link data-trunk rel="copy-file" href="assets/logo.svg" />
    <link data-trunk rel="rust" data-bin="open-3d-viewer" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1c1e; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; font: 15px/1.5 system-ui, sans-serif; color: #d6d6d8; text-align: center; padding: 16px;
      }
      #boot img { width: 72px; height: 72px; }
      #boot a { color: #f5960a; }
      body.running #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="logo.svg" alt="" />
      <div id="boot-text">Open 3D Viewer Studio is loading…</div>
    </div>
    <script>
      // The viewer draws with WebGPU; say so plainly where the browser has none.
      if (!navigator.gpu) {
        document.getElementById("boot-text").innerHTML =
          "This browser has no WebGPU, which Open 3D Viewer Studio needs.<br>" +
          "Use a current Chrome, Edge, Firefox or Safari, or the desktop app from " +
          '<a href="https://github.com/OpenAEC-Foundation/open-3d-viewer/releases">the releases</a>.';
      }
      // iced adds its canvas to the page once the app runs
      new MutationObserver((_, observer) => {
        if (document.querySelector("canvas")) {
          document.body.classList.add("running");
          observer.disconnect();
        }
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
