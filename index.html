<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- the app zooms itself: the browser's own pinch zoom would fight the 3D view -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5960a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="3D Viewer" />
    <title>Open 3D Viewer Studio</title>
    <meta name="description" content="Open 3D Viewer Studio: view IFC, SketchUp, Tekla, glTF, OBJ, STL and PLY models in the browser and save them as IFC. Open source, by the OpenAEC Foundation." />
    <link data-trunk rel="icon" href="assets/logo.svg" />
    <link data-trunk rel="copy-file" href="assets/logo.svg" />
    <!-- installable as an app (Android, ChromeOS, desktop Chrome and Edge) and startable offline -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link data-trunk rel="copy-file" href="web/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="web/sw.js" />
    <link data-trunk rel="copy-dir" href="web/icons" />
    <link data-trunk rel="rust" data-bin="open-3d-viewer" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals --enable-simd" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1c1e; }
      /* touch-action: the app handles every finger itself (orbit, pinch, pan), the browser none */
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #install {
        position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 2; display: none;
        align-items: center; gap: 10px; padding: 8px 8px 8px 14px; max-width: calc(100% - 32px); box-sizing: border-box;
        font: 14px/1.4 system-ui, sans-serif; background: #2c2c2e; color: #f2f2f4; border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      #install.shown { display: flex; }
      #install span { white-space: nowrap; }
      #install button { font: inherit; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      #install-yes { background: #f5960a; color: #281e0f; font-weight: 600; }
      #install-no { background: transparent; color: #d6d6d8; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; font: 15px/1.5 system-ui, sans-serif; background: #1c1c1e; color: #d6d6d8; text-align: center; padding: 16px;
      }
      #boot img { width: 72px; height: 72px; }
      #boot a { color: #f5960a; }
      body.running #boot { display: none; }
      /* without a GPU the app still opens, but cannot draw the model: keep the message on top */
      body.unsupported #boot { display: flex; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="install" role="dialog" aria-label="Install">
      <span>Install as an app</span>
      <button id="install-yes" type="button">Install</button>
      <button id="install-no" type="button" aria-label="Not now">✕</button>
    </div>
    <div id="boot">
      <img src="logo.svg" alt="" />
      <div id="boot-text">Open 3D Viewer Studio is loading…</div>
    </div>
    <script>
      // The viewer draws with WebGPU, or WebGL2 where the browser offers no WebGPU adapter (Chrome on
      // Linux, many phones). Without either, or when the app stops while starting, say so plainly
      // instead of leaving "loading" on screen.
      const unsupported = (reason) => {
        document.body.classList.add("unsupported");
        document.getElementById("boot-text").innerHTML =
          reason + "<br>" +
          "Use a current Chrome, Edge, Firefox or Safari with hardware acceleration on, or the desktop app from " +
          '<a href="https://github.com/OpenAEC-Foundation/open-3d-viewer/releases">the releases</a>.';
      };
      (async () => {
        const webgpu = navigator.gpu ? await navigator.gpu.requestAdapter().catch(() => null) : null;
        const webgl2 = !!document.createElement("canvas").getContext("webgl2");
        if (!webgpu && !webgl2) {
          unsupported("This browser offers neither WebGPU nor WebGL2, which Open 3D Viewer Studio needs to draw.");
        }
      })();
      for (const type of ["error", "unhandledrejection"]) {
        addEventListener(type, () => {
          if (!document.body.classList.contains("started")) {
            unsupported("Open 3D Viewer Studio could not start its graphics in this browser.");
          }
        });
      }
      // The app shell is kept for offline starts (web/sw.js). Not under `trunk serve`: a service
      // worker would hold on to that address for every project served there afterwards.
      if ("serviceWorker" in navigator && !["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) {
        addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
      // On a phone or tablet, offer to install the app once, unless it was declined before. The
      // desktop has its own app (the releases), and the browser's menu can always install it.
      (() => {
        const box = document.getElementById("install");
        let offer = null;
        const declined = () => { try { return localStorage.getItem("o3v-install-declined") === "1"; } catch { return false; } };
        const hide = () => box.classList.remove("shown");
        addEventListener("beforeinstallprompt", (e) => {
          if (!matchMedia("(pointer: coarse)").matches || declined()) return;
          e.preventDefault();
          offer = e;
          box.classList.add("shown");
          setTimeout(hide, 20000);
        });
        document.getElementById("install-yes").addEventListener("click", async () => {
          hide();
          if (offer) { offer.prompt(); await offer.userChoice.catch(() => {}); offer = null; }
        });
        document.getElementById("install-no").addEventListener("click", () => {
          hide();
          try { localStorage.setItem("o3v-install-declined", "1"); } catch {}
        });
        addEventListener("appinstalled", hide);
      })();
      // iced adds its canvas to the page once the app runs
      new MutationObserver((_, observer) => {
        if (document.querySelector("canvas")) {
          document.body.classList.add("running");
          observer.disconnect();
          // the app keeps going once it has drawn its first frames
          setTimeout(() => document.body.classList.add("started"), 3000);
        }
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
