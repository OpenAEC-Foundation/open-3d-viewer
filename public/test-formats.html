<!DOCTYPE html>
<html>
<head>
  <title>Format Loader Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #ccc; font-family: monospace; padding: 16px; font-size: 13px; }
    h1 { font-size: 16px; margin-bottom: 12px; color: #8af; }
    .row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #222; }
    .row:hover { background: #1a1a2a; }
    .badge { display: inline-block; width: 50px; text-align: center; padding: 2px 0; border-radius: 3px; font-weight: bold; font-size: 10px; }
    .pending { background: #333; color: #888; }
    .loading { background: #553; color: #ee8; }
    .ok { background: #253; color: #6e6; }
    .fail { background: #533; color: #e66; }
    .warn { background: #453; color: #ea6; }
    .file { flex: 1; }
    .info { color: #777; font-size: 11px; min-width: 200px; }
    .time { color: #666; font-size: 11px; width: 60px; text-align: right; }
    #summary { margin-top: 12px; padding: 10px; background: #1a1a2a; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Open 3D Viewer — Format Loader Test</h1>
  <div id="results"></div>
  <div id="summary"></div>

  <script type="module">
    // Test files — one per format
    const tests = [
      { file: 'test-cube.stl', format: 'STL' },
      { file: 'test-cube.obj', format: 'OBJ' },
      { file: 'test-sphere.3mf', format: '3MF' },
      { file: 'test-cube.wrl', format: 'WRL' },
      { file: 'test-pointcloud.xyz', format: 'XYZ' },
      { file: 'test-cube.vtk', format: 'VTK' },
      { file: 'test.gcode', format: 'GCODE' },
      { file: 'test.amf', format: 'AMF' },
      { file: 'test-floorplan.dxf', format: 'DXF' },
      { file: '2021_lc.skp', format: 'SKP' },
    ];

    const results = document.getElementById('results');
    const summary = document.getElementById('summary');

    // Create rows
    for (const t of tests) {
      const row = document.createElement('div');
      row.className = 'row';
      row.id = `row-${t.format}`;
      row.innerHTML = `
        <span class="badge pending" id="badge-${t.format}">WAIT</span>
        <span class="file">${t.file}</span>
        <span class="info" id="info-${t.format}">—</span>
        <span class="time" id="time-${t.format}">—</span>
      `;
      results.appendChild(row);
    }

    // Import the loader system
    const { getLoader, isSupported } = await import('/src/engine/loaders/LoaderRegistry.ts');

    let passed = 0, failed = 0, warned = 0;

    for (const t of tests) {
      const badge = document.getElementById(`badge-${t.format}`);
      const info = document.getElementById(`info-${t.format}`);
      const time = document.getElementById(`time-${t.format}`);

      badge.textContent = 'LOAD';
      badge.className = 'badge loading';

      const ext = '.' + t.file.split('.').pop().toLowerCase();

      if (!isSupported(ext)) {
        badge.textContent = 'SKIP';
        badge.className = 'badge warn';
        info.textContent = `Extension ${ext} not registered`;
        warned++;
        continue;
      }

      const start = performance.now();

      try {
        // Fetch file
        const res = await fetch(`/samples/${t.file}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const buffer = await res.arrayBuffer();

        // Get loader
        const loader = await getLoader(ext);
        if (!loader) throw new Error('No loader returned');

        // Parse
        const result = await loader(buffer, t.file);

        const elapsed = (performance.now() - start).toFixed(0);
        time.textContent = `${elapsed}ms`;

        // Check result
        const verts = result.totalVertices || 0;
        const tris = result.totalTriangles || 0;
        const hasScene = 'scene' in result;
        const hasGeom = 'geometries' in result;

        if (verts === 0 && tris === 0 && !hasScene) {
          badge.textContent = 'WARN';
          badge.className = 'badge warn';
          info.textContent = `Parsed but empty: 0 verts, 0 tris`;
          warned++;
        } else {
          badge.textContent = 'OK';
          badge.className = 'badge ok';
          const sceneInfo = hasScene ? 'ThreeJSResult' : 'ParsedModel';
          info.textContent = `${sceneInfo} — ${verts.toLocaleString()} verts, ${tris.toLocaleString()} tris`;

          // Extra check: if ThreeJSResult, check if scene has children
          if (hasScene) {
            let meshCount = 0;
            let pointsCount = 0;
            let lineCount = 0;
            result.scene.traverse(c => {
              if (c.isMesh) meshCount++;
              if (c.isPoints) pointsCount++;
              if (c.isLine || c.isLineSegments) lineCount++;
            });
            info.textContent += ` | ${meshCount} meshes, ${pointsCount} points, ${lineCount} lines`;

            if (meshCount === 0 && pointsCount === 0 && lineCount === 0 && verts === 0) {
              badge.textContent = 'WARN';
              badge.className = 'badge warn';
              info.textContent += ' (NO GEOMETRY!)';
              warned++;
              passed--; // undo the pass count below
            }
          }
          passed++;
        }
      } catch (err) {
        const elapsed = (performance.now() - start).toFixed(0);
        time.textContent = `${elapsed}ms`;
        badge.textContent = 'FAIL';
        badge.className = 'badge fail';
        info.textContent = err.message || String(err);
        failed++;
      }
    }

    summary.innerHTML = `
      <strong>Resultaat:</strong>
      <span style="color:#6e6">${passed} OK</span> ·
      <span style="color:#ea6">${warned} WARN</span> ·
      <span style="color:#e66">${failed} FAIL</span> /
      ${tests.length} totaal
    `;
  </script>
</body>
</html>
