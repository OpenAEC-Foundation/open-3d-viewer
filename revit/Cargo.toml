[package]
name = "open-3d-viewer-revit"
version = "2026.44.10"
description = "Open 3D Viewer Studio with Revit support (OpenAEC rvt-reader)"
authors = ["Open 3D Viewer Studio Contributors"]
# The viewer is LGPL-3.0-or-later; rvt-reader is proprietary, so this build is not redistributable
# as open source.
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.88"
publish = false

# Standalone package, next to the viewer (`..`), not in its workspace.
[workspace]

[[bin]]
name = "open-3d-viewer"
path = "src/main.rs"

[dependencies]
open-3d-viewer = { path = ".." }
glam = "0.30"
# Revit (.rvt / .rfa): the private OpenAEC rvt reader (github.com/OpenAEC-Foundation/rvt-dll),
# checked out next to this repository as `rvt-reader`.
rvt-read = { path = "../../rvt-reader/crates/rvt-read" }
rvt-export = { path = "../../rvt-reader/crates/rvt-export", default-features = false }
rvt-model = { path = "../../rvt-reader/crates/rvt-model" }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
