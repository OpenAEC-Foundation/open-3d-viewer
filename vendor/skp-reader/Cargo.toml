[package]
name = "skp-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "Partial pure-Rust SketchUp SKP reader, classic and 2021+ containers"
repository = "https://github.com/OpenAEC-Foundation/skp-reader"

[workspace]

[dependencies]
openaec-model = { version = "0.1.0", path = "../openaec-model" }
glam = "0.30"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
earcutr = "0.5"

[features]
corpus-tests = []
