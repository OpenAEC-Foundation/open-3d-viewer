[package]
name = "tekla-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "Experimental clean-room Tekla Structures DB1 geometry reader"
repository = "https://github.com/OpenAEC-Foundation/tekla-reader"

[workspace]

[dependencies]
openaec-model = { version = "0.1.0", path = "../openaec-model" }
glam = "0.30"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
earcutr = "0.5"
